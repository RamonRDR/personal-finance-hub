name: One-time repository formatter
on:
  push:
    branches: ["feat/personal-finance-hub"]
permissions:
  contents: write
jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[formatted]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run format
      - name: Commit formatted files only if changed
        run: |
          if ! git diff --quiet; then
            git add -A
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "style: apply Prettier [formatted]"
            git push origin HEAD:feat/personal-finance-hub
          fi
