name: One-time repository formatting
on:
  push:
    branches: ["feat/personal-finance-hub"]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/personal-finance-hub
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm run format
      - name: Commit canonical formatting and npm lockfile
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .
            git commit -m "style: apply Prettier formatting"
            git push origin HEAD:feat/personal-finance-hub
          fi
